<!doctype html>

<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,#0d1a33 0%,var(--bg) 60%);color:var(--txt);font:17px/1.5 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 38px;max-width:820px;width:94%;max-height:96vh;overflow:auto;box-shadow:0 0 60px #2f7bff22}
h1{margin:0;font-size:46px;letter-spacing:4px;font-weight:900;font-style:italic}h1 span{color:var(--acc)}
h2{margin:0 0 8px;font-size:26px;letter-spacing:1px}.tag{color:var(--acc2);font-size:14px;letter-spacing:3px;text-transform:uppercase;font-weight:700}
p{margin:8px 0;color:#c4cede}.dim{color:var(--dim);font-size:14px}.hype{font-size:22px;font-style:italic;color:#fff;margin:6px 0 4px}
button{background:linear-gradient(90deg,var(--acc),#5a3bff);color:#fff;border:0;border-radius:10px;padding:13px 26px;font-size:18px;font-weight:700;cursor:pointer;margin:14px 10px 0 0}
button.alt{background:#1a2338;font-weight:400;font-size:16px}button:hover{filter:brightness(1.15)}
select,input{background:#070b14;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:17px;width:130px}
.big{font-size:64px;font-weight:900;color:var(--acc2);margin:0;line-height:1.1;text-shadow:0 0 30px #00d8ff66}
.clear{font-size:58px;font-weight:900;font-style:italic;color:var(--acc2);letter-spacing:3px;text-shadow:0 0 40px #00d8ff88;animation:pop .45s ease-out}
.fail{font-size:46px;font-weight:900;font-style:italic;color:var(--bad);letter-spacing:2px}
.stars{font-size:46px;color:var(--gold);letter-spacing:6px}.stars i{color:#2a3550;font-style:normal}
.rank{font-size:20px;color:var(--gold);font-weight:700;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:12px}
.tile{background:#0a1426;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:14px}
.tile b{display:block;font-size:15px;color:#fff}.tile .s{color:var(--gold);font-size:18px;letter-spacing:2px}.tile.lock{opacity:.35;cursor:default}.tile.next{border-color:var(--acc2);box-shadow:0 0 14px #00d8ff55}
.bar{height:8px;background:#141d30;border-radius:4px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#c{position:absolute;inset:0;display:none}
#hud{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:20px;color:#dfe7f5;display:none;pointer-events:none;text-shadow:0 1px 4px #000;font-weight:600;letter-spacing:.5px}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="ui"></div>
<script>
'use strict';
// EGO AIM. Selection = a blind A/B search (the PSA method) for the sensitivity she aims best with. Training = 13 short
// stages (20-40 s each) eased from untimed first touches to pressure stages, with stars, a rank climb and sound.
// Built for a short attention span: one goal per stage, instant feedback, instant retry, failure text that says what to change.
// Mouse counts map straight to degrees via each game's yaw (degrees turned per mouse count at sensitivity 1), so no DPI is needed.
const LANG = (localStorage.ego_lang || navigator.language || 'en').slice(0, 2) === 'hu' ? 'hu' : 'en';
const GAMES = [['Valorant', 0.07], ['Counter-Strike 2', 0.022], ['Apex Legends', 0.022], ['Overwatch 2', 0.0066], ['Marvel Rivals', 0.0175]];   // last one derived, not published
let GAME = +(localStorage.ego_game || 0) % GAMES.length, YAW = GAMES[GAME][1];
const defSens = () => +(0.0327 / YAW).toFixed(2);   // about 35 cm per full turn at 800 DPI, a middle-of-the-road start
const START_SENS = defSens();
const HFOV = 103 * Math.PI / 180;
const SEL = [1.8, 1.5, 1.3, 1.15, 1.07, 1.03];
const TRIAL = [{k: 'flick', n: 6, r: 2.2}, {k: 'move', n: 4, v: 1}, {k: 'track', s: 6, r: 2.4, v: 1}];
// ponytail: pass marks are beginner estimates; each fail after the first eases that stage by 10% (max 30%) so nobody gets stuck
const STAGES = [
  {d: [{k: 'flick', n: 8, r: 2.6}], pass: {}},
  {d: [{k: 'track', s: 8, r: 2.8, v: 0.8}], pass: {on: 0.35}},
  {d: [{k: 'move', n: 5, v: 0.8}], pass: {}},
  {d: [{k: 'flick', n: 10, r: 2.2}], pass: {t: 14}},
  {d: [{k: 'track', s: 10, r: 2.4, v: 1}], pass: {on: 0.45}},
  {d: [{k: 'move', n: 6, v: 1}], pass: {t: 16}},
  {d: [{k: 'flick', n: 12, r: 1.7}], pass: {t: 16, miss: 4}},
  {d: [{k: 'flick', n: 6, r: 2.2}, {k: 'move', n: 4, v: 1}, {k: 'track', s: 6, r: 2.4, v: 1}], pass: {t: 20, on: 0.4}},
  {d: [{k: 'flick', n: 15, r: 2.2, life: 1.8, lives: 3}], pass: {}},
  {d: [{k: 'flick', n: 18, r: 2.0, at: 3, s: 22}], pass: {}},
  {d: [{k: 'move', n: 8, v: 1.3}], pass: {t: 18}},
  {d: [{k: 'track', s: 10, r: 2.0, v: 1.35}], pass: {on: 0.4}},
  {d: [{k: 'flick', n: 20, r: 1.9, life: 1.4, lives: 3, at: 2}], pass: {}},
];
const RANKS = [280, 250, 220, 190, 160, 130, 100, 75, 50, 30, 15, 5, 1];
const pct = x => Math.round(x * 100) + '%', f1 = x => x.toFixed(1);

const TX = {
en: {
  sub: 'Blue Lock aim training. Find your sensitivity, then clear 13 short stages, from your first touch to full pressure.',
  name: 'Your name', game: 'Your game', sens: 'Your sensitivity in that game',
  sensNote: 'The in-game mouse sensitivity, not the Windows mouse speed. Not sure? Leave the suggested number and press Find my sensitivity. Use the mouse, DPI and mousepad you play with. Esc pauses.',
  find: 'Find my sensitivity (6 min)', have: 'I have my sensitivity: start training', cont: 'Continue',
  names: ['First Touch', 'Lock On', 'On the Move', 'Quick Shot', 'Shadow', 'Chase', 'Sharpshooter', 'Full Field', 'Pressure', 'Swarm', 'Counterattack', 'Predator', 'Ego'],
  hype: ['Every striker starts here.', 'Find it. Stay on it.', 'They move. So do you.', 'Now the clock is on.', 'Become its shadow.', 'Faster feet, faster eyes.', 'Small targets. Big ego.', 'The whole field is yours.', 'Pressure shows who you are.', 'Too many? One at a time.', 'They are faster now. Be faster.', 'Hunt it down.', 'Only one striker remains.'],
  stage: i => 'Stage ' + i, rank: r => 'Blue Lock #' + r, go: 'GO', next: 'Next stage', retry: 'Try again', map: 'Stage map',
  dFlick: d => `Hit ${d.n} targets` + (d.at > 1 ? `, ${d.at} at once` : '') + (d.life ? `. Each one vanishes after ${f1(d.life)} s; ${d.lives} lost ends the stage` : '') + (d.s ? `. Time limit ${Math.round(d.s)} s` : '') + '.',
  dMove: d => `Hit ${d.n} moving targets while you strafe.`, dTrack: d => `Keep the crosshair on the ball for ${d.s} s.`,
  pass: p => 'To pass: ' + ([p.t && `under ${f1(p.t)} s`, p.miss != null && `at most ${p.miss} misses`, p.on && `at least ${pct(p.on)} on target`].filter(Boolean).join(', ') || 'just finish it') + '.',
  eased: e => `Coach: this stage is now ${pct(e - 1)} easier.`,
  cleared: 'STAGE CLEAR', notYet: 'NOT YET',
  why: {slow: x => `${f1(x)} s too slow. Click the moment the ball turns green.`, miss: (m, mx) => `${m} misses; the limit is ${mx}. Slow down a little: accuracy first, speed comes by itself.`,
        on: (g, n) => `${pct(g)} on target; ${pct(n)} needed. Move your hand with the ball, not after it.`, lives: 'They got away. Look at the newest ball, not the last one.', cap: 'Time ran out. Take the closest ball first.'},
  stopWin: 'Five stages today. The best moment to stop is on a win: your hands keep it overnight.',
  grad: 'BLUE LOCK GRADUATE', gradSub: 'Rank 1. Replay any stage for three stars, and run Find my sensitivity again on another day to confirm your number.',
  selT: (i, n) => `Selection ${i} of ${n}`, selB: 'Two weapons, A and B, each a different sensitivity. Play both; the better one survives. You do not need to judge anything.',
  wA: 'Weapon A', wB: 'Weapon B', aDone: 'Weapon A done. Now weapon B.',
  yours: 'YOUR WEAPON', rivals: g => g + ' sensitivity', typeIt: (s, g) => `In ${g}, set your mouse sensitivity to ${s} (both axes, if the game has two). Keep the same mouse and DPI setting.`,

  hudHits: (h, n) => `${h}/${n}`, hudOn: x => `${pct(x)} on target`, combo: c => `COMBO x${c}`, lives: 'Lives',
  paused: 'Paused', restart: 'Restart', sound: m => m ? 'Sound: off' : 'Sound: on', again: 'Find my sensitivity again', home: 'Home',
  rawNote: '   (raw input not available, so turn off "Enhance pointer precision" in Windows)',
  tiers: ['Beginner', 'Intermediate', 'Advanced', 'Saint', 'King', 'Emperor', 'God'], tier: t => 'Rank: ' + t,
  tierNote: 'Your rank comes from your stars and how few attempts each stage took. Three stars on the first try is perfect.', tierUp: (a, b) => `${a} &rarr; ${b}`,

  share: 'Challenge friends', copied: 'Copied. Paste it to your friends.', pts: p => p + ' pts',
  shareTxt: (t, p, st, link) => `I am ${t} in EGO AIM with ${p} points and ${st} stars. Beat me: ${link}`,
  board: 'Friends board', you: 'you', chal: (n, t, p) => `<b>${n}</b> challenges you: ${t}, ${p} points. Clear stages to beat them.`,

},
hu: {
  sub: 'Blue Lock-célzóedzés. Megkeressük az érzékenységedet, aztán 13 rövid szinten mész végig, az első érintéstől a teljes nyomásig.',
  name: 'A neved', game: 'A játékod', sens: 'Az érzékenységed abban a játékban',
  sensNote: 'A játékon belüli egérérzékenység, nem a Windows egérsebessége. Nem tudod? Hagyd a javasolt számot, és nyomd meg az Érzékenységem megkeresése gombot. Azt az egeret, DPI-t és egérpadot használd, amivel játszani szoktál. Az Esc megállítja.',
  find: 'Érzékenységem megkeresése (6 perc)', have: 'Megvan az érzékenységem: kezdődjön az edzés', cont: 'Folytatás',
  names: ['Első érintés', 'Célra tartás', 'Mozgásban', 'Gyors lövés', 'Árnyék', 'Üldözés', 'Mesterlövész', 'Teljes pálya', 'Nyomás', 'Raj', 'Ellentámadás', 'Ragadozó', 'Ego'],
  hype: ['Minden csatár itt kezdi.', 'Találd meg, és maradj rajta.', 'Ők mozognak. Te is.', 'Most már megy az óra.', 'Légy az árnyéka.', 'Gyorsabb láb, gyorsabb szem.', 'Kis célpontok. Nagy ego.', 'Az egész pálya a tiéd.', 'A nyomás megmutatja, ki vagy.', 'Túl sok? Egyszerre csak egyet.', 'Most gyorsabbak. Légy te is gyorsabb.', 'Vadászd le.', 'Csak egy csatár marad.'],
  stage: i => i + '. szint', rank: r => 'Blue Lock #' + r, go: 'RAJTA', next: 'Következő szint', retry: 'Újra', map: 'Szintek',
  dFlick: d => `Találj el ${d.n} célpontot` + (d.at > 1 ? `, egyszerre ${d.at} van kint` : '') + (d.life ? `. Mindegyik ${f1(d.life).replace('.', ',')} mp után eltűnik; ha ${d.lives} elszökik, vége a szintnek` : '') + (d.s ? `. Időkorlát: ${Math.round(d.s)} mp` : '') + '.',
  dMove: d => `Találj el ${d.n} mozgó célpontot, miközben oldalazol.`, dTrack: d => `Tartsd a célkeresztet a golyón ${d.s} másodpercig.`,
  pass: p => 'A teljesítéshez: ' + ([p.t && `${f1(p.t).replace('.', ',')} mp alatt`, p.miss != null && `legfeljebb ${p.miss} hibával`, p.on && `legalább ${pct(p.on)} a célon`].filter(Boolean).join(', ') || 'csak érj a végére') + '.',
  eased: e => `Edző: ez a szint most ${pct(e - 1)}-kal könnyebb.`,
  cleared: 'SZINT TELJESÍTVE', notYet: 'MÉG NEM',
  why: {slow: x => `${f1(x).replace('.', ',')} mp-cel lassabb. Abban a pillanatban kattints, amikor a golyó zöldre vált.`, miss: (m, mx) => `${m} hiba; a határ ${mx}. Lassíts egy kicsit: előbb a pontosság, a gyorsaság magától jön.`,
        on: (g, n) => `${pct(g)} a célon; ${pct(n)} kellett. A golyóval együtt mozdítsd a kezed, ne utána.`, lives: 'Elszöktek. A legújabb golyót nézd, ne az előzőt.', cap: 'Lejárt az idő. Mindig a legközelebbi golyót vedd először.'},
  stopWin: 'Ma már öt szint megvan. A legjobb győzelemmel abbahagyni: a kezed éjjel megjegyzi.',

  wA: 'A fegyver', wB: 'B fegyver', aDone: 'Az A fegyver kész. Most jön a B.',
  yours: 'A TE FEGYVERED', rivals: g => g + '-érzékenység', typeIt: (s, g) => `A ${g} játékban állítsd az egérérzékenységet ${s} értékre (mindkét tengelyen, ha kettő van). Maradj ugyanannál az egérnél és DPI-beállításnál.`,
  other: 'Ugyanez az érzés más játékokban: ', dpi: 'Tudod az egered DPI-értékét? ', cm: ' cm egérmozgás egy teljes körbeforduláshoz',
  set0: 'Egy másik napon futtasd újra az érzékenységkeresést. Ha két eredmény 10%-on belül van egymáshoz, a számod beállt.',

  setNo: (p, d) => `Legutóbb ${p} lett, ${d} az eltérés, így még nem állt be. Futtasd újra egy másik napon; 10%-on belül azt jelenti, beállt.`,
  keep: 'Utána maradj ennél: legalább egy hétig játssz ezzel a számmal, mielőtt változtatsz rajta.', train: 'Kezdődik az edzés',
  hudHits: (h, n) => `${h}/${n}`, hudOn: x => `${pct(x)} a célon`, combo: c => `KOMBÓ x${c}`, lives: 'Életek',
  paused: 'Szünet', restart: 'Újrakezdés', sound: m => m ? 'Hang: ki' : 'Hang: be', again: 'Érzékenység újrakeresése', home: 'Főoldal',
  rawNote: '   (a nyers egérjel nem elérhető, ezért kapcsold ki a Windows egérbeállításaiban a mutatópontosság növelését)',
  tiers: ['Kezdő', 'Középhaladó', 'Haladó', 'Szent', 'Király', 'Császár', 'Isten'], tier: t => 'Rang: ' + t,
  tierNote: 'A rangod a csillagaidból jön, és abból, hány próbálkozás kellett egy-egy szinthez. Három csillag elsőre a tökéletes.', tierUp: (a, b) => `${a} &rarr; ${b}`,
  lang: 'English',
  share: 'Kihívom a barátaimat', copied: 'Kimásolva. Küldd el a barátaidnak.', pts: p => p + ' pont',
  shareTxt: (t, p, st, link) => `${t} vagyok az EGO AIM-ben, ${p} ponttal és ${st} csillaggal. Győzz le: ${link}`,
  board: 'Baráti ranglista', you: 'te', chal: (n, t, p) => `<b>${n}</b> kihív téged: ${t}, ${p} pont. Teljesíts szinteket, hogy legyőzd.`,
  bHead: ['Játékos', 'Rang', 'Pont', 'Csillag', 'Szint'],
}};
const L = TX[LANG];

// ---------- state and storage ----------
let rnd = Math.random;
function seed(a) { rnd = () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ui = document.getElementById('ui'), cv = document.getElementById('c'), hud = document.getElementById('hud'), g = cv.getContext('2d');
const DB = JSON.parse(localStorage.egopub_players || '{}');
let NAME = localStorage.ego_name || '', RAW = false, MUTE = localStorage.ego_mute === '1';
function me() { const P = DB[NAME] = DB[NAME] || {sens: START_SENS, stars: {}, cleared: 0, fails: {}, sel: [], day: '', today: 0}; P.tries = P.tries || {}; P.first = P.first || {}; return P; }
// Seven ranks: per cleared stage, 10 points a star minus 3 for every extra attempt before the first clear; the average decides.
const TIER_AT = [0, 8, 13, 17, 21, 25, 28];
function tierOf(P) { const k = Object.keys(P.first); if (!k.length) return -1;
  const avg = k.reduce((a, i) => a + Math.max(0, 10 * (P.stars[i] || 0) - 3 * (P.first[i] - 1)), 0) / k.length;
  let t = 0; TIER_AT.forEach((x, j) => { if (avg >= x) t = j; }); return t; }
// Points: the same per-stage score that sets the rank, summed (max 390).
const ptsOf = P => Object.keys(P.first).reduce((a, i) => a + Math.max(0, 10 * (P.stars[i] || 0) - 3 * (P.first[i] - 1)), 0);
const starsOf = P => Object.values(P.stars).reduce((a, x) => a + x, 0);
const clean = x => String(x).replace(/[^\p{L}\p{N} _.-]/gu, '').slice(0, 24) || '?';
const FR = JSON.parse(localStorage.egopub_friends || '{}');
function card(P) { return {n: NAME, t: Math.max(0, tierOf(P)), p: ptsOf(P), s: starsOf(P), c: P.cleared}; }
function fromCode(code) {   // untrusted: anyone can craft a link, so every field is cleaned and clamped
  try { const o = JSON.parse(decodeURIComponent(escape(atob(code.replace(/-/g, '+').replace(/_/g, '/')))));
    const c = Math.max(0, Math.min(13, o.c | 0));   // points and stars can never exceed what that many stages can give
    return {n: clean(o.n), t: Math.max(0, Math.min(6, o.t | 0)), p: Math.max(0, Math.min(30 * c, o.p | 0)), s: Math.max(0, Math.min(3 * c, o.s | 0)), c}; } catch (e) { return null; } }
const toCode = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
let CHAL = null;
if (location.hash.startsWith('#c=')) { CHAL = fromCode(location.hash.slice(3)); if (CHAL) { FR[CHAL.n] = CHAL; localStorage.egopub_friends = JSON.stringify(FR); } history.replaceState(null, '', location.pathname); }
function shareIt() { const P = me(), link = location.origin + location.pathname + '#c=' + toCode(card(P));
  const txt = L.shareTxt(L.tiers[Math.max(0, tierOf(P))], ptsOf(P), starsOf(P), link);
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { document.getElementById('shr').textContent = L.copied; }, () => prompt(L.share, txt)); }
function boardHtml(P) { const rows = Object.values(FR).filter(f => f.n !== NAME).concat([Object.assign(card(P), {me: true})]).sort((a, b) => b.p - a.p || b.s - a.s);
  if (rows.length < 2) return '';
  return `<h2 style="margin-top:18px;font-size:20px">${L.board}</h2><table style="width:100%;font-size:15px;border-collapse:collapse">` + `<tr class="dim"><td>#</td>${L.bHead.map(h => `<td>${h}</td>`).join('')}</tr>` +
    rows.map((f, j) => `<tr style="${f.me ? 'color:var(--acc2);font-weight:700' : ''}"><td>${j + 1}</td><td>${clean(f.n)}${f.me ? ' (' + L.you + ')' : ''}</td><td>${L.tiers[f.t]}</td><td>${f.p}</td><td>${f.s}</td><td>${f.c}/13</td></tr>`).join('') + '</table>'; }
const tierHtml = P => { const t = tierOf(P); return t < 0 ? '' : `<div class="rank" style="font-size:26px">${L.tier(L.tiers[t])}</div><div class="dim">${L.tiers.map((x, j) => j === t ? `<b style="color:var(--gold)">${x}</b>` : x).join(' &middot; ')}</div>`; };
function save() { localStorage.egopub_players = JSON.stringify(DB); }
const ease = i => 1 + 0.1 * Math.min(3, Math.max(0, (me().fails[i] || 0) - 1));
const rankOf = c => c ? RANKS[c - 1] : 300;

function show(html) { ui.style.display = 'flex'; cv.style.display = 'none'; hud.style.display = 'none'; ui.innerHTML = '<div class="card">' + html + '</div>'; }
async function lock() {
  try { await cv.requestPointerLock({unadjustedMovement: true}); RAW = true; }
  catch (e) { RAW = false; try { await cv.requestPointerLock(); } catch (e2) {} }
}
