function sources() { show(`<div class="tag">${L.srcBtn}</div><h2>Where your rank comes from</h2>${LANG === 'hu' ? '<p class="dim">Ez az oldal angolul van, hogy a forrásokat szó szerint lehessen ellenőrizni.</p>' : ''} <p>Every number below is public. Each link opens the original, so you can check it yourself. Pulled on 12 November 2026 and pulled again the same evening: every value matched within 0.001.</p> <h3>1. How the score is built</h3> <p>The King Trials measure three things: reaction (median of 5 clicks), flick (seconds per target over 20 targets, plus 0.25 s per miss) and tracking (share of 20 seconds with the crosshair on the target). Luck is designed out: every flick run uses the same 20 distances (evenly spaced from 10 to 45 degrees, in shuffled order, all on screen), and the tracking target follows a sum of five sine waves with random phases, the standard tracking signal in motor-control research since McRuer and Jex (1967): unpredictable, yet equally hard every run. Each part is placed on a real player population and turned into a standard score. Your score = 0.2 x reaction + 0.4 x flick + 0.4 x tracking, then read as "top X% of players".</p> <table class="src"><tr><th>Rank</th><th>Beginner</th><th>Intermediate</th><th>Advanced</th><th>Saint</th><th>King</th><th>Emperor</th><th>God</th></tr> <tr><td>Share of players</td><td>bottom 15%</td><td>top 85%</td><td>top 55%</td><td>top 30%</td><td>top 15%</td><td>top 5%</td><td>top 0.5%</td></tr> <tr><td>Who that is</td><td>just started</td><td>casual average</td><td>tryhard, good</td><td>strong</td><td>very strong</td><td>elite</td><td>pro level</td></tr></table> <p class="dim">The shares are of aim-trainer players (KovaaK's and Aim Lab), a stronger field than gamers in general, so a casual average player sits low in it: just over 40% of Aim Lab's 270,106 ranked PC players are in its lowest rank, Iron, and its elite ranks hold 0.17%. <a href="https://aimlabs.com/articles/aimlabs/what-does-your-aimlabs-benchmarks-rank-actually-mean/" target="_blank" rel="noopener">Aimlabs, 8 Apr 2026</a></p> <h3>2. Reaction</h3><p>Population: Human Benchmark's own percentile table for its reaction test: 70,940 results in 25 ms steps, the table the site itself uses to rank a 5-test average (our test uses the median of 5 clicks). It is built into the site's script: <a href="https://humanbenchmark.com/tests/reactiontime/statistics" target="_blank" rel="noopener">Human Benchmark statistics</a>. Results under 100 ms are left out, the same rule as our false starts.</p> <table class="src"><tr><th>Reaction</th><th>150 ms</th><th>175 ms</th><th>200 ms</th><th>225 ms</th><th>250 ms</th><th>275 ms</th><th>300 ms</th><th>350 ms</th></tr> <tr><td>Players slower</td><td>98.9%</td><td>92.4%</td><td>74.5%</td><td>52.9%</td><td>32.9%</td><td>19.1%</td><td>11.3%</td><td>5.1%</td></tr></table> <p class="dim">Note: the same site states a median of 273 ms over 81 million single clicks. Its percentile table centres lower (229 ms), most likely because it holds averages of 5 tries from people who saved their results. We use the table, since it matches how our test is measured.</p> <h3>3. Flick</h3> <p>Population: KovaaK's leaderboard "VT ww5t Intermediate S5", 78,563 players when pulled (each player's best run). Time per target = 600 / score. <a href="https://kovaaks.com/webapp-backend/leaderboard/scores/global?leaderboardId=98029&page=0&max=20" target="_blank" rel="noopener">raw leaderboard data</a></p> <table class="src"><tr><th>Players faster than this</th><th>0.1%</th><th>1%</th><th>5%</th><th>10%</th><th>25%</th><th>50%</th><th>75%</th><th>90%</th><th>99%</th></tr> <tr><td>KovaaK's, s per target</td><td>0.328</td><td>0.368</td><td>0.384</td><td>0.405</td><td>0.444</td><td>0.488</td><td>0.545</td><td>0.618</td><td>0.789</td></tr> <tr><td>Our test, s per target</td><td>0.546</td><td>0.613</td><td>0.640</td><td>0.675</td><td>0.740</td><td>0.813</td><td>0.908</td><td>1.030</td><td>1.315</td></tr></table> <p>Our targets are further away (10-45 degrees) and appear one at a time, so the KovaaK's times are scaled by 1.666. That factor sets the median player to 0.813 s, built only from published measurements:</p> <ul><li>0.162 s to start moving the mouse after a target appears: amateurs in <a href="https://d1qx31qr3h6wln.cloudfront.net/publications/Aim_and_Shoot_preprint.pdf" target="_blank" rel="noopener">Lee et al. 2025, aim-and-shoot study</a> (103 degree view, pros 0.161 s).</li> <li>0.609 s of movement: our targets average 3.23 bits of Fitts' difficulty, at 5.3 bits per second measured for aiming in a first-person game by <a href="https://csse.canterbury.ac.nz/andrew.cockburn/papers/fitts-game.pdf" target="_blank" rel="noopener">Looser, Cockburn and Savage 2005</a>.</li> <li>0.042 s of miss penalty: the 85.7% average first-day hit rate of 7,174 Aim Lab players in <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8720934/" target="_blank" rel="noopener">Listman et al. 2021</a>.</li></ul> <h3>4. Tracking</h3> <p>Shape: KovaaK's leaderboard "VT Controlsphere Novice S5", 105,404 players when pulled. Share on target = score / 6000: the scenario description gives 100 points per second on target, and the 60 s length is inferred from the accuracy field stored with each run (they agree within 1 point). <a href="https://kovaaks.com/webapp-backend/leaderboard/scores/global?leaderboardId=103765&page=0&max=20" target="_blank" rel="noopener">raw leaderboard data</a></p> <p>Level: our target is much harder to stay on than Controlsphere's. We measured how much on our own players: on the current sine-wave target, across 7 King Trials runs from 3 players, their tracking sat 1.64 log-odds below what their flick scores predict on Controlsphere (each player alone: 1.22, 1.64 and 1.89; measured 12 November). The Controlsphere curve is shifted by that amount. Runs on the old target (random direction changes) keep their own table: 1.2 log-odds, from 26 runs by 3 players. <a href="https://egoaim-   g.fillStyle = '#fff'; g.fillRect(x + w * ACCF - 1, y - 4, 2, 18);
}

function firstPush(rec) {
